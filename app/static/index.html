<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Document Q&A Assistant</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #121620;
    --surface-2: #1a1f2c;
    --border: #262c3b;
    --text: #e6e9ef;
    --text-dim: #8b92a5;
    --accent: #6d8dff;
    --accent-2: #9b6dff;
    --success: #3ecf8e;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 780px; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-size: 28px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--text-dim); margin-top: 8px; font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: var(--surface-2);
  }
  .dropzone svg { width: 32px; height: 32px; margin-bottom: 10px; color: var(--accent); }
  .dropzone p { color: var(--text-dim); font-size: 14px; }
  .dropzone .filename { color: var(--text); font-weight: 500; margin-top: 8px; }
  input[type="file"] { display: none; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .dot.success { background: var(--success); }
  .dot.error { background: var(--error); }
  .dot.loading {
    background: var(--accent);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .chat { display: none; flex-direction: column; gap: 14px; }
  .chat-log { display: flex; flex-direction: column; gap: 14px; }
  .chat.active { display: flex; }

  .msg { max-width: 88%; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  .source-item { margin-top: 6px; padding: 8px; background: var(--surface); border-radius: 8px; }
  .source-item .meta { color: var(--accent); font-weight: 500; margin-bottom: 4px; }

  .input-row { display: flex; gap: 10px; margin-top: 20px; }
  input[type="text"] {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  footer { margin-top: 30px; text-align: center; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Document Q&amp;A Assistant</h1>
      <p>Upload a document and ask grounded, citation-backed questions</p>
    </header>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/></svg>
        <p>Click to select or drag a PDF, DOCX, or TXT file</p>
        <div class="filename" id="filename"></div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
      <div class="status-row">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">No document uploaded</span>
      </div>
    </div>

    <div class="card chat" id="chatCard">
      <div class="chat-log" id="chatLog"></div>
      <div class="input-row">
        <input type="text" id="questionInput" placeholder="Ask a question about your document..." disabled>
        <button id="askBtn" disabled>Ask</button>
      </div>
    </div>

    <footer>Local embeddings via Sentence-Transformers · Answers via Groq</footer>
  </div>

<script>
const API_BASE = window.location.origin + "/api";
let collectionId = null;

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const filenameEl = document.getElementById("filename");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const chatCard = document.getElementById("chatCard");
const chatLog = document.getElementById("chatLog");
const questionInput = document.getElementById("questionInput");
const askBtn = document.getElementById("askBtn");

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleUpload(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) handleUpload(fileInput.files[0]);
});

async function handleUpload(file) {
  filenameEl.textContent = file.name;
  setStatus("loading", "Processing document...");
  chatCard.classList.remove("active");
  chatLog.innerHTML = "";
  collectionId = null;
  questionInput.disabled = true;
  askBtn.disabled = true;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed");

    collectionId = data.collection_id;
    setStatus("success", `Ready — ${data.chunks} chunks indexed`);
    chatCard.classList.add("active");
    questionInput.disabled = false;
    askBtn.disabled = false;
    questionInput.focus();
  } catch (err) {
    setStatus("error", err.message);
  }
}

function setStatus(state, text) {
  statusDot.className = "dot " + state;
  statusText.textContent = text;
}

function addMessage(role, content, sources) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  msg.textContent = content;

  if (sources && sources.length) {
    const sourcesEl = document.createElement("div");
    sourcesEl.className = "sources";
    sourcesEl.innerHTML = "Sources:";
    sources.forEach((s, i) => {
      const item = document.createElement("div");
      item.className = "source-item";
      item.innerHTML = `<div class="meta">Source ${i + 1} · page ${s.page}</div>${s.snippet}...`;
      sourcesEl.appendChild(item);
    });
    msg.appendChild(sourcesEl);
  }

  chatLog.appendChild(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
  return msg;
}

function addTyping() {
  const msg = document.createElement("div");
  msg.className = "msg assistant";
  msg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatLog.appendChild(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
  return msg;
}

async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question || !collectionId) return;

  addMessage("user", question);
  questionInput.value = "";
  askBtn.disabled = true;
  questionInput.disabled = true;

  const typingEl = addTyping();

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ collection_id: collectionId, question }),
    });
    const data = await res.json();
    typingEl.remove();
    if (!res.ok) throw new Error(data.detail || "Query failed");

    addMessage("assistant", data.answer, data.sources);
  } catch (err) {
    typingEl.remove();
    addMessage("assistant", "Error: " + err.message);
  } finally {
    askBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }
}

askBtn.addEventListener("click", askQuestion);
questionInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html>
